<h1>개인정보처리방침</h1>
<p>M2S 미디어는 유튜브 쇼츠 업로드 자동화를 위한 개인/내부용 도구이며, 별도의 이용자 개인정보를 수집하지 않습니다.</p>
<p>본 앱은 사용자 본인의 Google 계정 인증(OAuth)을 통해 YouTube Data API 및 YouTube Analytics API에 접근하여, 본인이 소유한 채널에 영상을 업로드하고 통계를 조회하는 용도로만 사용됩니다.</p>
<p>수집된 인증 토큰은 로컬 기기에만 저장되며, 제3자에게 제공되거나 외부 서버로 전송되지 않습니다.</p>
